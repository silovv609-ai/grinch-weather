
name: Build Weather APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract weather project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          SETTINGS_FILE=$(find source -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Fix Java and Kotlin compatibility
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          for file in root.rglob("build.gradle.kts"):
              content = file.read_text(encoding="utf-8")

              content = re.sub(
                  r'JavaVersion\.VERSION_1_8',
                  'JavaVersion.VERSION_17',
                  content
              )

              content = re.sub(
                  r'JavaVersion\.VERSION_11',
                  'JavaVersion.VERSION_17',
                  content
              )

              content = re.sub(
                  r'jvmTarget\s*=\s*"[^"]+"',
                  'jvmTarget = "17"',
                  content
              )

              content = re.sub(
                  r'jvmTarget\.set\(JvmTarget\.JVM_[0-9_]+\)',
                  'jvmTarget.set(JvmTarget.JVM_17)',
                  content
              )

              file.write_text(content, encoding="utf-8")
              print("Checked:", file)

          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grinch-weather-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
