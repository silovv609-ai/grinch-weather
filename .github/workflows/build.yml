name: Build Weather APK

on:
workflow_dispatch:
push:
paths:
- 'GrinchWeatherWidget_24h_14days_wind_direction.zip'
- '.github/workflows/build.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract project
    run: unzip GrinchWeatherWidget_24h_14days_wind_direction.zip -d source

  - name: Build APK
    working-directory: source/GrinchWeatherWidget
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: grinch-weather-apk
      path: source/GrinchWeatherWidget/app/build/outputs/apk/debug/app-debug.apk
